name: Publish SDE database

# CCP does not push notifications, so this polls. The check is cheap: the build
# manifest is ~80 bytes, and the 99 MB archive is only fetched when the build
# number has actually changed. Most runs exit in seconds having downloaded
# nothing.
#
# One poll, every layer acts on it: when the build number moves, the layer-1
# release publishes as before, and the fitting-engine job proves layer 2
# rebuilds cleanly at the *same* build (adapter refresh + reference battery +
# full test suite) and posts the battery diff — the balance-change report.
# Layers stay independently installable: the engine job publishes nothing to
# the release; it only verifies and reports.
#
# Note: GitHub runs scheduled workflows from the default branch only, so the
# fitting jobs go live when the fitting layer merges to main. Pushes that
# touch fitting/ run the test job from any branch immediately.
on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours at :20 (avoids the on-the-hour rush)
  workflow_dispatch:          # "Run workflow" button
    inputs:
      force:
        description: "Rebuild even if the SDE build number has not changed"
        type: boolean
        default: false
  push:
    paths:
      - "fitting/**"
      - ".claude/skills/eve-fitting/**"
      - ".github/workflows/sde-release.yml"

permissions:
  contents: write             # needed to commit the marker and publish releases

concurrency:
  # release runs (schedule/dispatch) all share one group so builds never race;
  # push-triggered test runs group per branch so they don't queue behind releases
  group: ${{ github.event_name == 'push' && format('fitting-tests-{0}', github.ref) || 'sde-release' }}
  cancel-in-progress: false

jobs:
  check-and-build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Check CCP's current build number
        id: check
        run: |
          set -euo pipefail
          latest=$(curl -sSf --retry 3 --retry-delay 5 \
            https://developers.eveonline.com/static-data/tranquility/latest.jsonl)
          echo "manifest: $latest"
          build=$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["buildNumber"])')
          released=$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("releaseDate",""))')

          known=""
          [ -f sde-build.json ] && known=$(python3 -c 'import json;print(json.load(open("sde-build.json"))["buildNumber"])')

          echo "build=$build"       >> "$GITHUB_OUTPUT"
          echo "released=$released" >> "$GITHUB_OUTPUT"

          if [ "$build" = "$known" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build $build already published; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New SDE build $build (was ${known:-none}) - rebuilding."
          fi

      - name: Build the database
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 .claude/skills/eve-sde/scripts/build_sde_db.py --db eve-sde.sqlite --complete --positions --split --parts-only --compress xz
          rm -f eve-sde*.sqlite               # keep only the compressed copies
          ls -l eve-sde*.xz

      - name: Verify the archive round-trips
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import lzma, shutil, sqlite3, os, glob

          parts = sorted(glob.glob("eve-sde-*.sqlite.xz"))
          assert len(parts) >= 5, f"expected the split parts, found {len(parts)}"
          seen, total = {}, 0
          for p in parts:
              psize = os.path.getsize(p)
              total += psize
              assert psize < 30_000_000, f"{p} is {psize/1e6:.1f} MB, over the 30 MB upload limit"
              with lzma.open(p) as f, open("pt.sqlite", "wb") as o:
                  shutil.copyfileobj(f, o)
              db = sqlite3.connect("pt.sqlite")
              assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok", f"{p} corrupt"
              grp = db.execute("SELECT value FROM meta WHERE key='splitGroup'").fetchone()
              assert grp, f"{p} has no splitGroup marker"
              assert db.execute("SELECT value FROM meta WHERE key='complete'").fetchone(), \
                  f"{p} is not from a complete build"
              seen[grp[0]] = psize
              db.close()
              os.remove("pt.sqlite")

          # the parts must actually cover the data, not just exist
          for need in ("items", "universe", "moons", "industry", "world"):
              assert need in seen, f"missing the {need} part"
          with lzma.open("eve-sde-universe.sqlite.xz") as f, open("u.sqlite", "wb") as o:
              shutil.copyfileobj(f, o)
          u = sqlite3.connect("u.sqlite")
          s = u.execute("SELECT COUNT(*) FROM systems").fetchone()[0]
          xs = u.execute("SELECT COUNT(*) FROM planets WHERE x IS NOT NULL").fetchone()[0]
          assert s > 8000, f"universe looks short: {s} systems"
          assert xs > 60000, f"positions missing: only {xs} planets have coordinates"
          u.close(); os.remove("u.sqlite")

          with lzma.open("eve-sde-moons.sqlite.xz") as f, open("mo.sqlite", "wb") as o:
              shutil.copyfileobj(f, o)
          mo = sqlite3.connect("mo.sqlite")
          m = mo.execute("SELECT COUNT(*) FROM moons").fetchone()[0]
          mg = mo.execute("SELECT COUNT(*) FROM moons WHERE surfaceGravity IS NOT NULL").fetchone()[0]
          assert m > 300000, f"moons looks short: {m} rows"
          assert mg > 300000, f"moon statistics missing: only {mg} rows have gravity"
          mo.close(); os.remove("mo.sqlite")

          with lzma.open("eve-sde-items.sqlite.xz") as f, open("i.sqlite", "wb") as o:
              shutil.copyfileobj(f, o)
          i = sqlite3.connect("i.sqlite")
          n = i.execute("SELECT COUNT(*) FROM types").fetchone()[0]
          assert n > 40000, f"items looks short: {n} types"
          i.close(); os.remove("i.sqlite")

          print(f"verified {len(parts)} parts, {total/1e6:.1f} MB total, "
                f"{s:,} systems, {m:,} moons, {n:,} types, positions present")
          for g, sz in sorted(seen.items(), key=lambda kv: -kv[1]):
              print(f"  {g:<10} {sz/1e6:>6.2f} MB")
          PY

      - name: Record the build number
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cat > sde-build.json <<EOF
          {
            "buildNumber": ${{ steps.check.outputs.build }},
            "releaseDate": "${{ steps.check.outputs.released }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sde-build.json
          # Committing also counts as repository activity, which keeps GitHub
          # from auto-disabling this schedule after 60 days of inactivity.
          git commit -m "SDE build ${{ steps.check.outputs.build }}" || echo "nothing to commit"
          git push

      - name: Publish the release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="sde-${{ steps.check.outputs.build }}"
          (cd .claude/skills && zip -qr ../../eve-sde-skill.zip eve-sde)
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" eve-sde-*.sqlite.xz eve-sde-skill.zip \
            --title "SDE build ${{ steps.check.outputs.build }}" \
            --notes "EVE Online SDE build \`${{ steps.check.outputs.build }}\`, released by CCP on \`${{ steps.check.outputs.released }}\`.

          **Layer 1 in one download, no git needed:** \`eve-sde-skill.zip\` is the query skill — upload it under Settings → Capabilities → Skills in the Claude apps, then attach the \`.xz\` parts a question needs. Both are always from this repo's latest state at CCP's current build.

          The complete SDE as indexed SQLite, split by domain. Each part is a full database — fetch only what you need, and \`ATTACH\` several to join across them.

          | Part | Covers |
          | --- | --- |
          | \`eve-sde-universe\` | systems, planets, belts, stargates, stations, 3D coordinates |
          | \`eve-sde-moons\` | all 344k moons with their physical statistics |
          | \`eve-sde-items\` | types, dogma attributes and effects, reprocessing, market groups |
          | \`eve-sde-world\` | missions, dungeons, agents, corporations, certificates |
          | \`eve-sde-industry\` | blueprints, schematics, assembly lines |
          | \`eve-sde-cosmetic\` | skins, graphics, icons |
          | \`eve-sde-misc\` | the remainder |

          \`\`\`bash
          xz -d eve-sde-universe.sqlite.xz
          \`\`\`

          Split rather than combined because the 30 MB per-file upload limit on claude.ai is per *file*: as parts everything fits, including the 3D coordinates a single archive cannot carry.

          Built by \`build_sde_db.py\`; schema and query notes are in \`.claude/skills/eve-sde/SKILL.md\`."

  # Layer 2 tracks the same build: rebuild the engine's eve.db from the SDE
  # export the release above was built from, then prove nothing broke. The
  # battery diff in the job summary is the balance-change report; the smoke
  # suite failing after a real balance change is the re-pin signal (update
  # spike/reference/, eval keys, and any doc examples that moved).
  fitting-engine:
    needs: check-and-build
    if: needs.check-and-build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      - name: Cache the pyfa checkout + venv
        uses: actions/cache@v4
        with:
          path: fitting/work
          key: fitting-work-${{ steps.py.outputs.python-version }}-${{ hashFiles('fitting/spike/setup_pyfa.sh', 'fitting/spike/requirements.txt') }}-${{ needs.check-and-build.outputs.build }}
          restore-keys: |
            fitting-work-${{ steps.py.outputs.python-version }}-${{ hashFiles('fitting/spike/setup_pyfa.sh', 'fitting/spike/requirements.txt') }}-

      - name: Set up the engine (pyfa checkout, venv, bundled db)
        run: |
          set -euo pipefail
          fitting/spike/setup_pyfa.sh "$PWD/fitting/work"
          fitting/work/eosenv/bin/pip install --quiet mcp

      - name: Refresh eve.db at this release's build
        run: fitting/adapter/refresh.sh --pyfa fitting/work/pyfa --build "${{ needs.check-and-build.outputs.build }}"

      - name: Battery diff vs pinned references (the balance-change report)
        run: |
          set -euo pipefail
          fitting/work/eosenv/bin/python fitting/spike/run_battery.py \
            --pyfa fitting/work/pyfa --out battery-${{ needs.check-and-build.outputs.build }}
          echo '## Fitting battery: build ${{ needs.check-and-build.outputs.build }} vs pinned references' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if fitting/work/eosenv/bin/python fitting/spike/compare_panels.py \
               fitting/spike/reference battery-${{ needs.check-and-build.outputs.build }} \
               | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo 'No balance changes touch the reference fits.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '**NUMBERS MOVED** — re-pin needed: `fitting/spike/reference/`, eval keys (`fitting/evals/make_keys*.py`), and any doc examples quoting the old figures. The test step below is expected to fail until then.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the battery panels
        uses: actions/upload-artifact@v4
        with:
          name: battery-${{ needs.check-and-build.outputs.build }}
          path: battery-${{ needs.check-and-build.outputs.build }}
          retention-days: 30

      - name: Engine selftest + MCP smoke suite
        run: |
          set -euo pipefail
          fitting/work/eosenv/bin/python fitting/engine/selftest.py --pyfa fitting/work/pyfa
          fitting/work/eosenv/bin/python fitting/mcp/test_server.py --pyfa fitting/work/pyfa

  # Pushes touching the fitting layer: same suite, deterministic (bundled
  # data build, no CCP fetch), from any branch.
  fitting-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      - name: Cache the pyfa checkout + venv
        uses: actions/cache@v4
        with:
          path: fitting/work
          key: fitting-work-${{ steps.py.outputs.python-version }}-${{ hashFiles('fitting/spike/setup_pyfa.sh', 'fitting/spike/requirements.txt') }}-push
          restore-keys: |
            fitting-work-${{ steps.py.outputs.python-version }}-${{ hashFiles('fitting/spike/setup_pyfa.sh', 'fitting/spike/requirements.txt') }}-

      - name: Set up the engine (pyfa checkout, venv, bundled db)
        run: |
          set -euo pipefail
          fitting/spike/setup_pyfa.sh "$PWD/fitting/work"
          fitting/work/eosenv/bin/pip install --quiet mcp

      - name: Engine selftest + MCP smoke suite
        run: |
          set -euo pipefail
          fitting/work/eosenv/bin/python fitting/engine/selftest.py --pyfa fitting/work/pyfa
          fitting/work/eosenv/bin/python fitting/mcp/test_server.py --pyfa fitting/work/pyfa
